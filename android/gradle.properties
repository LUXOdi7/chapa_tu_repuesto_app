org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# El pub cache vive en C:\Users\...\AppData\Local\Pub\Cache y el proyecto en D:.
# La compilacion incremental de Kotlin calcula rutas RELATIVAS del modulo al
# fuente, y entre dos unidades distintas eso no existe: los plugins con codigo
# Kotlin (speech_to_text, image_picker_android) revientan con
# "this and base files have different roots".
# ponytail: apagar IC cuesta unos segundos por build de plugin (que casi nunca
# cambian). La alternativa es mover el pub cache o el proyecto a la misma
# unidad; si algun dia estan juntos, se puede borrar esta linea.
kotlin.incremental=false
